<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>국립대학교 공문 HWPX 자동 생성기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
    .doc-preview { font-family: 'Dotum', '돋움', 'Malgun Gothic', sans-serif; line-height: 1.65; word-break: keep-all; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">

  <!-- 상단 헤더 -->
  <header class="bg-slate-900 text-white px-6 py-3.5 flex flex-wrap items-center justify-between gap-3 shadow-md shrink-0">
    <div class="flex items-center gap-3">
      <span class="bg-blue-600 text-xs font-bold px-2.5 py-1 rounded">GNU HWPX</span>
      <h1 class="text-lg font-bold tracking-tight">공문서 자동 생성기</h1>
      <span id="templateBadge" class="text-xs px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">
        ⏳ 기본 템플릿(template.hwpx) 불러오는 중...
      </span>
    </div>

    <div class="flex items-center gap-2">
      <label class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium px-3 py-2 rounded-lg border border-slate-700 cursor-pointer transition">
        <span>📂 다른 양식 임시 사용</span>
        <input type="file" id="hwpxInput" accept=".hwpx" class="hidden" onchange="handleManualHwpxUpload(event)" />
      </label>
      <button onclick="copyAIPrompt()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3.5 py-2 rounded-lg shadow-xs transition flex items-center gap-1.5">
        <span>📋 AI 초안용 MD 프롬프트 복사</span>
      </button>
    </div>
  </header>

  <!-- 메인 2단 워크스페이스 -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 p-4 overflow-hidden">

    <!-- [좌측 6컬럼] 1. 마크다운 초안 입력 / 업로드 -->
    <section class="lg:col-span-6 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col overflow-hidden">
      <div class="p-4 border-b border-slate-100 bg-slate-50/70 flex items-center justify-between">
        <div>
          <h2 class="font-bold text-sm text-slate-700">1. 공문 초안 입력 (Markdown)</h2>
          <p class="text-xs text-slate-500 mt-0.5">.md 파일을 업로드하거나 AI가 작성한 초안을 붙여넣으세요</p>
        </div>
        <div class="flex gap-2">
          <button onclick="loadSampleMd()" class="text-xs bg-white hover:bg-slate-100 text-slate-600 px-2.5 py-1.5 rounded-lg border border-slate-300 transition">샘플 초기화</button>
          <label class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-3 py-1.5 rounded-lg border border-blue-200 cursor-pointer transition flex items-center gap-1">
            <span>📄 .md 파일 열기</span>
            <input type="file" id="mdInput" accept=".md,.txt" class="hidden" onchange="handleMdUpload(event)" />
          </label>
        </div>
      </div>

      <textarea id="mdEditor" oninput="updatePreview()" placeholder="여기에 공문 마크다운(.md) 내용을 붙여넣으세요..."
        class="flex-1 w-full p-5 text-xs font-mono leading-relaxed resize-none focus:outline-none text-slate-800 bg-white"></textarea>

      <div class="px-4 py-2.5 bg-slate-50 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-500">
        <span>서식: 제목(굴림체 14pt, 100%/0%) · 본문(돋움 12pt, 95%/-5%, 양쪽정렬, 어절 줄나눔)</span>
        <label class="flex items-center gap-1.5 cursor-pointer text-slate-700 font-medium">
          <input type="checkbox" id="removeBottomTable" checked class="rounded text-blue-600 focus:ring-blue-500" />
          <span>하단 결재란/시행정보 표 제거</span>
        </label>
      </div>
    </section>

    <!-- [우측 6컬럼] 2. 실시간 미리보기 및 HWPX 다운로드 -->
    <section class="lg:col-span-6 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col overflow-hidden">
      <div class="p-4 border-b border-slate-100 bg-slate-50/70 flex items-center justify-between">
        <div>
          <h2 class="font-bold text-sm text-slate-700">2. 공문 구조 미리보기 및 출력</h2>
          <p class="text-xs text-slate-500 mt-0.5">브라우저 내부에서 즉시 조립되며 외부 서버로 전송되지 않습니다</p>
        </div>
      </div>

      <div id="previewArea" class="flex-1 p-6 overflow-y-auto doc-preview text-xs bg-slate-50/40 space-y-3">
        <div class="text-slate-400 text-center mt-20">좌측에 마크다운 초안을 입력하면 공문 구조가 실시간으로 표시됩니다.</div>
      </div>

      <div class="p-4 border-t border-slate-200 bg-white">
        <button id="generateBtn" onclick="generateHWPX()" disabled
          class="w-full py-3.5 px-4 rounded-xl font-bold text-sm text-white bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed shadow-sm transition flex items-center justify-center gap-2">
          <span>⬇️ 공문 HWPX 생성 및 다운로드</span>
        </button>
      </div>
    </section>

  </main>

  <script>
    let templateBuffer = null;
    const HP_NS = 'http://www.hancom.co.kr/hwpml/2011/paragraph';
    const HH_NS = 'http://www.hancom.co.kr/hwpml/2011/head';
    const HC_NS = 'http://www.hancom.co.kr/hwpml/2011/core';

    // 1. 페이지 로드 시 같은 폴더의 template.hwpx 자동 로드
    window.addEventListener('DOMContentLoaded', async () => {
      loadSampleMd();
      await loadDefaultTemplate();
    });

    async function loadDefaultTemplate() {
      const badge = document.getElementById('templateBadge');
      try {
        const response = await fetch(`./template.hwpx?t=${Date.now()}`);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const buffer = await response.arrayBuffer();
        await validateAndSetTemplate('template.hwpx (기본 양식)', buffer);
      } catch (err) {
        badge.className = 'text-xs px-2.5 py-1 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30';
        badge.textContent = '⚠️ template.hwpx 자동 로드 실패 (우측 버튼으로 직접 선택 가능)';
        console.warn('기본 템플릿 로드 실패:', err);
      }
    }

    async function handleManualHwpxUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const buffer = await file.arrayBuffer();
      await validateAndSetTemplate(`${file.name} (임시 적용)`, buffer);
    }

    async function validateAndSetTemplate(label, buffer) {
      const badge = document.getElementById('templateBadge');
      try {
        const zip = await JSZip.loadAsync(buffer);
        const sectionFile = zip.file('Contents/section0.xml');
        if (!sectionFile) throw new Error('Contents/section0.xml이 없는 파일입니다.');

        const xmlText = await sectionFile.async('string');
        if (!xmlText.includes('{{TITLE}}') || !xmlText.includes('{{BODY_CONTENT}}')) {
          throw new Error('템플릿에 {{TITLE}} 또는 {{BODY_CONTENT}} 치환자가 없습니다.');
        }

        templateBuffer = buffer;
        badge.className = 'text-xs px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
        badge.textContent = `✔ 양식 준비 완료: ${label}`;
        document.getElementById('generateBtn').disabled = false;
      } catch (err) {
        badge.className = 'text-xs px-2.5 py-1 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30';
        badge.textContent = `✘ 양식 오류: ${err.message}`;
        alert('템플릿 검증 오류: ' + err.message);
      }
    }

    // 2. 마크다운 파일 읽기 및 정제 파싱
    function handleMdUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        document.getElementById('mdEditor').value = ev.target.result;
        updatePreview();
      };
      reader.readAsText(file, 'UTF-8');
    }

    function cleanMarkdownArtifacts(text) {
      return text
        .replace(/&nbsp;/gi, ' ')
        .replace(/\\([().\-*#\[\]_~`>+|])/g, '$1');
    }

    function parseMarkdownDoc(rawText) {
      let titleParts = [];
      let attachments = [];
      let bodyText = cleanMarkdownArtifacts(rawText).trim();

      // 1) --- 로 감싼 YAML 헤더가 있는 경우 추출
      const fmMatch = bodyText.match(/^---\s*\r?\n([\s\S]*?)\r?\n---\s*(?:\r?\n([\s\S]*))?$/);
      if (fmMatch) {
        const metaLines = fmMatch[1].split(/\r?\n/);
        let currentKey = '';

        metaLines.forEach(line => {
          const trimLine = line.trim();
          if (!trimLine) return;

          if (/^(?:[*#\-•]\s*)?\*{0,2}제목\*{0,2}\s*:/.test(trimLine)) {
            currentKey = 'title';
            const val = trimLine.replace(/^(?:[*#\-•]\s*)?\*{0,2}제목\*{0,2}\s*:\s*/, '').replace(/^["']|["']$/g, '').replace(/\\n/g, ' ').trim();
            if (val) titleParts.push(val);
          } else if (/^(?:[*#\-•]\s*)?\*{0,2}붙임\*{0,2}\s*:/.test(trimLine)) {
            currentKey = 'attach';
            const inlineVal = trimLine.replace(/^(?:[*#\-•]\s*)?\*{0,2}붙임\*{0,2}\s*:\s*/, '').trim();
            if (inlineVal && inlineVal !== '없음') {
              attachments.push(inlineVal);
            }
          } else if (currentKey === 'title') {
            const extra = trimLine.replace(/^-\s*/, '').replace(/^["']|["']$/g, '').replace(/\\n/g, ' ').trim();
            if (extra) titleParts.push(extra);
          } else if (currentKey === 'attach' && trimLine.startsWith('-')) {
            const item = trimLine.replace(/^-\s*/, '').trim();
            if (item && item !== '없음') {
              attachments.push(item);
            }
          }
        });

        bodyText = (fmMatch[2] || '').trim();
      }

      // 2) 본문에서 '제목:' 추출 후, 반드시 "1."로 시작하는 줄부터 본문 인식 시작
      const rawLines = bodyText.split(/\r?\n/);
      let firstItemIdx = -1;

      for (let idx = 0; idx < rawLines.length; idx++) {
        const trimLine = rawLines[idx].trim();
        if (!trimLine) continue;

        // "1." 항목이 나오기 전 영역에서 제목 추출
        const titleLineMatch = trimLine.match(/^(?:[*#\-•]\s*)?\*{0,2}제목\*{0,2}\s*:\s*(.+)$/);
        if (titleLineMatch) {
          if (titleParts.length === 0) {
            titleParts.push(titleLineMatch[1].replace(/\*\*/g, '').trim());
          }
          continue;
        }

        // 본문 시작점: "1." (또는 "**1.**")로 시작하는 첫 번째 줄 탐색
        if (/^\*{0,2}1\./.test(trimLine)) {
          firstItemIdx = idx;
          break;
        }
      }

      // "1."이 있으면 그 이전(기관명, (경유) 등)은 모두 제외하고 "1."부터 슬라이싱
      const activeLines = firstItemIdx >= 0 ? rawLines.slice(firstItemIdx) : rawLines;

      // 3) 본문 하단에 '붙임'으로 시작하는 줄이 있으면 attachments 배열로 분리
      const bodyOnlyLines = [];
      let inBottomAttach = false;

      for (let idx = 0; idx < activeLines.length; idx++) {
        const line = activeLines[idx];
        const trimLine = line.trim();

        const attachMatch = trimLine.match(/^(?:[*#\-•]\s*)?\*{0,2}붙임\*{0,2}(?:\s*:\s*|\s+)(.+)$/);
        if (attachMatch) {
          inBottomAttach = true;
          const val = attachMatch[1].replace(/\*\*/g, '').trim();
          if (val && val !== '없음') {
            attachments.push(val);
          }
          continue;
        }

        if (inBottomAttach) {
          if (trimLine) {
            const cleanAtt = trimLine.replace(/^-\s*/, '').replace(/\*\*/g, '').trim();
            if (cleanAtt && cleanAtt !== '없음') {
              attachments.push(cleanAtt);
            }
          }
          continue;
        }

        bodyOnlyLines.push(line);
      }

      const title = titleParts.length > 0 ? titleParts.join(' ') : '제목 없음';

      const blocks = [];
      let i = 0;

      while (i < bodyOnlyLines.length) {
        const line = bodyOnlyLines[i];
        const trimmed = line.trim();

        if (!trimmed) {
          i++;
          continue;
        }

        // 표 시작 감지
        if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
          let unitText = '';
          if (blocks.length > 0 && blocks[blocks.length - 1].type === 'unit') {
            unitText = blocks.pop().text;
          }

          const tableRows = [];
          while (i < bodyOnlyLines.length && bodyOnlyLines[i].trim().startsWith('|') && bodyOnlyLines[i].trim().endsWith('|')) {
            const rowStr = bodyOnlyLines[i].trim();
            if (!/^\|[\s\-:|]+\|$/.test(rowStr)) {
              const cells = rowStr.slice(1, -1).split('|').map(c => c.trim());
              tableRows.push(cells);
            }
            i++;
          }
          if (tableRows.length > 0) {
            blocks.push({ type: 'table', unit: unitText, rows: tableRows });
          }
          continue;
        }

        // 표 단위 표기
        if (/^[\[\(]단위\s*:.*[\]\)]$/.test(trimmed)) {
          blocks.push({ type: 'unit', text: trimmed.replace(/^\[/, '(').replace(/\]$/, ')') });
          i++;
          continue;
        }

        const leadingSpaces = line.match(/^(\s*)/)[1].length;
        blocks.push({ type: 'line', indent: leadingSpaces, text: trimmed });
        i++;
      }

      return { title, attachments, blocks };
    }

    // 3. 실시간 미리보기 렌더링
    function updatePreview() {
      const raw = document.getElementById('mdEditor').value;
      const parsed = parseMarkdownDoc(raw);
      const preview = document.getElementById('previewArea');

      const formatBoldHtml = (str) => str.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-slate-900">$1</strong>');

      let html = `
        <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-xs space-y-3">
          <div class="border-b border-slate-200 pb-2.5">
            <span class="text-[11px] font-bold text-blue-600 block">제목 (굴림체 14pt · 장평 100% · 자간 0%)</span>
            <div style="font-family: 'GulimChe', '굴림체', sans-serif;" class="font-normal text-sm text-slate-900 mt-1">${parsed.title}</div>
          </div>
          <div class="space-y-1.5 text-slate-800 whitespace-pre-wrap text-justify">
      `;

      parsed.blocks.forEach(b => {
        if (b.type === 'line' || b.type === 'unit') {
          const spaces = ' '.repeat(b.indent);
          html += `<div>${spaces}${formatBoldHtml(b.text)}</div>`;
        } else if (b.type === 'table') {
          if (b.unit) html += `<div class="text-right text-[11px] text-slate-600 mt-2">${b.unit}</div>`;
          html += `<table class="w-full border-collapse border border-slate-400 text-[11px] mb-1">`;
          b.rows.forEach((row, rIdx) => {
            html += `<tr class="${rIdx === 0 ? 'bg-slate-100 font-bold' : ''}">`;
            row.forEach(cell => {
              html += `<td class="border border-slate-400 px-2 py-1 text-center">${formatBoldHtml(cell)}</td>`;
            });
            html += `</tr>`;
          });
          html += `</table>`;
        }
      });

      html += `</div>`;

      if (parsed.attachments.length > 0) {
        html += `<div class="pt-3 text-slate-700 whitespace-pre-wrap text-justify">`;
        parsed.attachments.forEach((att, idx) => {
          html += `<div>${idx === 0 ? '붙임  ' : '      '}${att}</div>`;
        });
        html += `</div>`;
      }

      html += `</div>`;
      preview.innerHTML = html;
    }

    // 4. XML DOM 노드 생성 및 안전 조작 헬퍼
    function createEl(doc, ns, prefix, tagName, attrs = {}, children = []) {
      const node = doc.createElementNS(ns, `${prefix}:${tagName}`);
      for (const [k, v] of Object.entries(attrs)) {
        node.setAttribute(k, String(v));
      }
      children.forEach(child => {
        if (typeof child === 'string') {
          node.appendChild(doc.createTextNode(child));
        } else if (child) {
          node.appendChild(child);
        }
      });
      return node;
    }

    const createHpEl = (doc, tag, attrs, children) => createEl(doc, HP_NS, 'hp', tag, attrs, children);

    function removeDirectLineSeg(paraNode) {
      if (!paraNode) return;
      Array.from(paraNode.childNodes).forEach(child => {
        if (child.nodeName === 'hp:linesegarray') {
          paraNode.removeChild(child);
        }
      });
    }

    function injectCustomStyles(headerDoc) {
      const registerFontFace = (faceName) => {
        const langFontIds = {};
        const fontfaces = Array.from(headerDoc.getElementsByTagNameNS(HH_NS, 'fontface'));
        fontfaces.forEach(ff => {
          const lang = ff.getAttribute('lang');
          const fonts = Array.from(ff.getElementsByTagNameNS(HH_NS, 'font'));
          let found = fonts.find(f => f.getAttribute('face') === faceName);
          if (found) {
            langFontIds[lang] = found.getAttribute('id');
          } else {
            let maxFontId = -1;
            fonts.forEach(f => {
              const id = parseInt(f.getAttribute('id') || '0', 10);
              if (id > maxFontId) maxFontId = id;
            });
            const newFontId = String(maxFontId + 1);
            const baseFont = fonts[0].cloneNode(true);
            baseFont.setAttribute('id', newFontId);
            baseFont.setAttribute('face', faceName);
            baseFont.setAttribute('type', 'TTF');
            ff.appendChild(baseFont);
            ff.setAttribute('fontCnt', String(ff.getElementsByTagNameNS(HH_NS, 'font').length));
            langFontIds[lang] = newFontId;
          }
        });
        return langFontIds;
      };

      const gulimCheFontIds = registerFontFace('굴림체');
      const dotumFontIds = registerFontFace('돋움');

      const charProps = headerDoc.getElementsByTagNameNS(HH_NS, 'charProperties')[0];
      const existingChars = Array.from(charProps.getElementsByTagNameNS(HH_NS, 'charPr'));
      let maxCharId = 0;
      existingChars.forEach(cp => {
        const id = parseInt(cp.getAttribute('id') || '0', 10);
        if (id > maxCharId) maxCharId = id;
      });

      const createCustomCharPr = (fontIdsMap, heightVal, isBold, ratioVal = 95, spacingVal = -5) => {
        maxCharId += 1;
        const newId = String(maxCharId);
        const cp = existingChars[0].cloneNode(true);
        cp.setAttribute('id', newId);
        cp.setAttribute('height', String(heightVal));
        cp.setAttribute('textColor', '#000000');

        const fontRef = cp.getElementsByTagNameNS(HH_NS, 'fontRef')[0];
        if (fontRef) {
          ['hangul', 'latin', 'hanja', 'japanese', 'other', 'symbol', 'user'].forEach(k => {
            const upper = k.toUpperCase();
            if (fontIdsMap[upper]) fontRef.setAttribute(k, fontIdsMap[upper]);
          });
        }

        const ratio = cp.getElementsByTagNameNS(HH_NS, 'ratio')[0];
        if (ratio) {
          ['hangul', 'latin', 'hanja', 'japanese', 'other', 'symbol', 'user'].forEach(k => ratio.setAttribute(k, String(ratioVal)));
        }

        const spacing = cp.getElementsByTagNameNS(HH_NS, 'spacing')[0];
        if (spacing) {
          ['hangul', 'latin', 'hanja', 'japanese', 'other', 'symbol', 'user'].forEach(k => spacing.setAttribute(k, String(spacingVal)));
        }

        const oldBold = cp.getElementsByTagNameNS(HH_NS, 'bold')[0];
        if (isBold && !oldBold) {
          const boldEl = createEl(headerDoc, HH_NS, 'hh', 'bold');
          const italicEl = cp.getElementsByTagNameNS(HH_NS, 'italic')[0];
          const underlineEl = cp.getElementsByTagNameNS(HH_NS, 'underline')[0];
          cp.insertBefore(boldEl, italicEl || underlineEl || null);
        } else if (!isBold && oldBold && oldBold.parentNode) {
          oldBold.parentNode.removeChild(oldBold);
        }

        charProps.appendChild(cp);
        return newId;
      };

      const titleCharId = createCustomCharPr(gulimCheFontIds, 1400, false, 100, 0);
      const bodyNormalCharId = createCustomCharPr(dotumFontIds, 1200, false, 95, -5);
      const bodyBoldCharId = createCustomCharPr(dotumFontIds, 1200, true, 95, -5);
      const tblNormalCharId = createCustomCharPr(dotumFontIds, 1000, false, 95, -5);
      const tblBoldCharId = createCustomCharPr(dotumFontIds, 1000, true, 95, -5);
      const unitCharId = createCustomCharPr(dotumFontIds, 900, false, 95, -5);
      charProps.setAttribute('itemCnt', String(charProps.getElementsByTagNameNS(HH_NS, 'charPr').length));

      const paraProps = headerDoc.getElementsByTagNameNS(HH_NS, 'paraProperties')[0];
      const existingParas = Array.from(paraProps.getElementsByTagNameNS(HH_NS, 'paraPr'));
      let maxParaId = 0;

      const applyEojeolBreak = (ppNode) => {
        const bsList = Array.from(ppNode.getElementsByTagNameNS(HH_NS, 'breakSetting'));
        if (bsList.length > 0) {
          bsList.forEach(bs => {
            bs.setAttribute('breakLatinWord', 'KEEP_WORD');
            bs.setAttribute('breakNonLatinWord', 'BREAK_WORD');
            bs.setAttribute('lineWrap', 'BREAK');
          });
        } else {
          const newBs = createEl(headerDoc, HH_NS, 'hh', 'breakSetting', {
            breakLatinWord: 'KEEP_WORD',
            breakNonLatinWord: 'BREAK_WORD',
            widowOrphan: '0',
            keepWithNext: '0',
            keepLines: '0',
            pageBreakBefore: '0',
            lineWrap: 'BREAK'
          });
          ppNode.appendChild(newBs);
        }
      };

      existingParas.forEach(pp => {
        const id = parseInt(pp.getAttribute('id') || '0', 10);
        if (id > maxParaId) maxParaId = id;
        applyEojeolBreak(pp);
      });

      const titleBasePara = existingParas.find(pp => pp.getAttribute('id') === '25') || existingParas[0];
      maxParaId += 1;
      const titleParaId = String(maxParaId);
      const titlePp = titleBasePara.cloneNode(true);
      titlePp.setAttribute('id', titleParaId);
      applyEojeolBreak(titlePp);
      paraProps.appendChild(titlePp);

      const createCleanParaPr = (alignType = 'JUSTIFY', lineSpacingVal = 160) => {
        maxParaId += 1;
        const newId = String(maxParaId);
        const pp = existingParas[0].cloneNode(true);
        pp.setAttribute('id', newId);

        const align = pp.getElementsByTagNameNS(HH_NS, 'align')[0];
        if (align) {
          align.setAttribute('horizontal', alignType);
          align.setAttribute('vertical', 'BASELINE');
        }

        applyEojeolBreak(pp);
        Array.from(pp.getElementsByTagNameNS(HH_NS, 'breakSetting')).forEach(bs => {
          bs.setAttribute('autoSpacing', '0');
        });

        Array.from(pp.getElementsByTagNameNS(HC_NS, 'left')).forEach(el => el.setAttribute('value', '0'));
        Array.from(pp.getElementsByTagNameNS(HC_NS, 'right')).forEach(el => el.setAttribute('value', '0'));
        Array.from(pp.getElementsByTagNameNS(HC_NS, 'intent')).forEach(el => el.setAttribute('value', '0'));

        Array.from(pp.getElementsByTagNameNS(HH_NS, 'lineSpacing')).forEach(ls => {
          ls.setAttribute('type', 'PERCENT');
          ls.setAttribute('value', String(lineSpacingVal));
        });

        paraProps.appendChild(pp);
        return newId;
      };

      const bodyParaId = createCleanParaPr('JUSTIFY', 160);
      const centerParaId = createCleanParaPr('CENTER', 130);
      const rightParaId = createCleanParaPr('RIGHT', 120);

      paraProps.setAttribute('itemCnt', String(paraProps.getElementsByTagNameNS(HH_NS, 'paraPr').length));

      const borderFills = headerDoc.getElementsByTagNameNS(HH_NS, 'borderFills')[0];
      const existingBfs = Array.from(borderFills.getElementsByTagNameNS(HH_NS, 'borderFill'));
      let maxBfId = 0;
      existingBfs.forEach(bf => {
        const id = parseInt(bf.getAttribute('id') || '0', 10);
        if (id > maxBfId) maxBfId = id;
      });

      const baseBf = existingBfs.find(bf => bf.getElementsByTagNameNS(HC_NS, 'fillBrush').length > 0) || existingBfs[0];

      const cloneSolidBorderFill = (shadeHex) => {
        maxBfId += 1;
        const newId = String(maxBfId);
        const bf = baseBf.cloneNode(true);
        bf.setAttribute('id', newId);

        ['leftBorder', 'rightBorder', 'topBorder', 'bottomBorder'].forEach(side => {
          const bNode = bf.getElementsByTagNameNS(HH_NS, side)[0];
          if (bNode) {
            bNode.setAttribute('type', 'SOLID');
            bNode.setAttribute('width', '0.12 mm');
            bNode.setAttribute('color', '#000000');
          }
        });

        const winBrush = bf.getElementsByTagNameNS(HC_NS, 'winBrush')[0];
        if (winBrush) {
          winBrush.setAttribute('faceColor', shadeHex || 'none');
          winBrush.setAttribute('hatchColor', '#999999');
          winBrush.setAttribute('alpha', '0');
        }

        borderFills.appendChild(bf);
        return newId;
      };

      const bodyBorderId = cloneSolidBorderFill(null);
      const headerBorderId = cloneSolidBorderFill('#EAEAEA');
      borderFills.setAttribute('itemCnt', String(borderFills.getElementsByTagNameNS(HH_NS, 'borderFill').length));

      return {
        titleCharId,
        bodyNormalCharId,
        bodyBoldCharId,
        tblNormalCharId,
        tblBoldCharId,
        unitCharId,
        titleParaId,
        bodyParaId,
        centerParaId,
        rightParaId,
        bodyBorderId,
        headerBorderId
      };
    }

    function createRunNodes(doc, text, normalCharId, boldCharId) {
      const parts = text.split(/(\*\*.*?\*\*)/g).filter(p => p.length > 0);
      if (parts.length === 0) {
        return [createHpEl(doc, 'run', { charPrIDRef: normalCharId }, [createHpEl(doc, 't', {}, [''])])];
      }
      return parts.map(part => {
        if (part.startsWith('**') && part.endsWith('**')) {
          const inner = part.slice(2, -2);
          return createHpEl(doc, 'run', { charPrIDRef: boldCharId }, [createHpEl(doc, 't', {}, [inner])]);
        }
        return createHpEl(doc, 'run', { charPrIDRef: normalCharId }, [createHpEl(doc, 't', {}, [part])]);
      });
    }

    function createTableBlockNodes(doc, tableBlock, styles) {
      const resultNodes = [];

      if (tableBlock.unit) {
        const unitP = createHpEl(doc, 'p', {
          id: 0, paraPrIDRef: styles.rightParaId, styleIDRef: 0, pageBreak: 0, columnBreak: 0, merged: 0
        }, [
          createHpEl(doc, 'run', { charPrIDRef: styles.unitCharId }, [createHpEl(doc, 't', {}, [tableBlock.unit])])
        ]);
        resultNodes.push(unitP);
      }

      const totalWidth = 43500;
      const totalRows = tableBlock.rows.length;
      const colCnt = tableBlock.rows[0].length;
      const colWidth = Math.floor(totalWidth / colCnt);
      const tblId = Math.floor(1000000000 + Math.random() * 900000000);

      const trNodes = tableBlock.rows.map((row, rIdx) => {
        const isHeader = (rIdx === 0);
        const defaultCharRef = isHeader ? styles.tblBoldCharId : styles.tblNormalCharId;
        const cellBorderId = isHeader ? styles.headerBorderId : styles.bodyBorderId;

        const tcNodes = row.map((cellText, cIdx) => {
          const cellP = createHpEl(doc, 'p', { id: 0, paraPrIDRef: styles.centerParaId, styleIDRef: 0, pageBreak: 0, columnBreak: 0, merged: 0 },
            createRunNodes(doc, cellText, defaultCharRef, styles.tblBoldCharId)
          );
          const subList = createHpEl(doc, 'subList', {
            id: '', textDirection: 'HORIZONTAL', lineWrap: 'BREAK', vertAlign: 'CENTER',
            linkListIDRef: 0, linkListNextIDRef: 0, textWidth: 0, textHeight: 0, hasTextRef: 0, hasNumRef: 0
          }, [cellP]);

          return createHpEl(doc, 'tc', {
            name: '', header: isHeader ? 1 : 0, hasMargin: 0, protect: 0, editable: 0, dirty: 0, borderFillIDRef: cellBorderId
          }, [
            subList,
            createHpEl(doc, 'cellAddr', { colAddr: cIdx, rowAddr: rIdx }),
            createHpEl(doc, 'cellSpan', { colSpan: 1, rowSpan: 1 }),
            createHpEl(doc, 'cellSz', { width: colWidth, height: 1500 }),
            createHpEl(doc, 'cellMargin', { left: 200, right: 200, top: 120, bottom: 120 })
          ]);
        });

        return createHpEl(doc, 'tr', {}, tcNodes);
      });

      const tblNode = createHpEl(doc, 'tbl', {
        id: tblId, zOrder: 5, numberingType: 'TABLE', textWrap: 'TOP_AND_BOTTOM', textFlow: 'BOTH_SIDES',
        lock: 0, dropcapstyle: 'None', pageBreak: 'CELL', repeatHeader: 1, rowCnt: totalRows, colCnt: colCnt,
        cellSpacing: 0, borderFillIDRef: styles.bodyBorderId, noAdjust: 0
      }, [
        createHpEl(doc, 'sz', { width: totalWidth, widthRelTo: 'ABSOLUTE', height: totalRows * 1500, heightRelTo: 'ABSOLUTE', protect: 0 }),
        createHpEl(doc, 'pos', { treatAsChar: 1, affectLSpacing: 0, flowWithText: 1, allowOverlap: 0, holdAnchorAndSO: 0, vertRelTo: 'PARA', horzRelTo: 'PARA', vertAlign: 'TOP', horzAlign: 'LEFT', vertOffset: 0, horzOffset: 0 }),
        createHpEl(doc, 'outMargin', { left: 140, right: 140, top: 60, bottom: 140 }),
        createHpEl(doc, 'inMargin', { left: 200, right: 200, top: 120, bottom: 120 }),
        ...trNodes
      ]);

      const runNode = createHpEl(doc, 'run', { charPrIDRef: styles.bodyNormalCharId }, [
        createHpEl(doc, 't', {}, ['     ']),
        tblNode,
        createHpEl(doc, 't', {}, [''])
      ]);

      resultNodes.push(createHpEl(doc, 'p', { id: 0, paraPrIDRef: styles.bodyParaId, styleIDRef: 0, pageBreak: 0, columnBreak: 0, merged: 0 }, [runNode]));
      return resultNodes;
    }

    // 5. 최종 HWPX 생성
    async function generateHWPX() {
      if (!templateBuffer) {
        alert('기본 템플릿이 로드되지 않았습니다. GitHub 저장소에 template.hwpx 파일이 있는지 확인해 주세요.');
        return;
      }

      const raw = document.getElementById('mdEditor').value;
      const parsed = parseMarkdownDoc(raw);
      const shouldRemoveBottom = document.getElementById('removeBottomTable').checked;

      try {
        const zip = await JSZip.loadAsync(templateBuffer);
        const parser = new DOMParser();
        const serializer = new XMLSerializer();

        // A. header.xml 스타일 주입
        const headerStr = await zip.file('Contents/header.xml').async('string');
        const headerDoc = parser.parseFromString(headerStr, 'application/xml');
        const styles = injectCustomStyles(headerDoc);
        let newHeaderStr = serializer.serializeToString(headerDoc);
        if (!newHeaderStr.startsWith('<?xml')) {
          newHeaderStr = '<?xml version="1.0" encoding="UTF-8" standalone="yes" ?>' + newHeaderStr;
        }
        zip.file('Contents/header.xml', newHeaderStr);

        // B. section0.xml 파싱 및 치환
        const xmlStr = await zip.file('Contents/section0.xml').async('string');
        const xmlDoc = parser.parseFromString(xmlStr, 'application/xml');
        if (xmlDoc.querySelector('parsererror')) throw new Error('템플릿 XML 파싱 오류');

        const tNodes = Array.from(xmlDoc.getElementsByTagName('hp:t'));

        // 1) {{TITLE}} 치환
        const titleTNode = tNodes.find(n => n.textContent.includes('{{TITLE}}'));
        if (titleTNode) {
          const titleRun = titleTNode.parentNode;
          const titlePara = titleRun.parentNode;
          const titleSubList = titlePara.parentNode;

          if (titleSubList && titleSubList.nodeName === 'hp:subList') {
            titleSubList.setAttribute('lineWrap', 'BREAK');
          }

          removeDirectLineSeg(titlePara);
          titlePara.setAttribute('paraPrIDRef', styles.titleParaId);
          titlePara.setAttribute('styleIDRef', '0');

          titleTNode.textContent = parsed.title;
          titleRun.setAttribute('charPrIDRef', styles.titleCharId);
        }

        // 2) {{BODY_CONTENT}} 치환 ("1."부터 시작하는 본문만 출력)
        const bodyTNode = Array.from(xmlDoc.getElementsByTagName('hp:t')).find(n => n.textContent.includes('{{BODY_CONTENT}}'));
        if (bodyTNode) {
          const targetRun = bodyTNode.parentNode;
          const firstPara = targetRun.parentNode;
          const secRoot = firstPara.parentNode;
          const anchorNext = firstPara.nextSibling;

          removeDirectLineSeg(firstPara);

          if (parsed.blocks.length === 0) {
            bodyTNode.textContent = '';
          } else {
            const firstBlock = parsed.blocks[0];
            let extraBlocks = [];

            if (firstBlock.type === 'table') {
              bodyTNode.textContent = '';
              extraBlocks = parsed.blocks;
            } else {
              firstPara.setAttribute('paraPrIDRef', styles.bodyParaId);
              const lineText = ' '.repeat(firstBlock.indent) + firstBlock.text;
              const firstRuns = createRunNodes(xmlDoc, lineText, styles.bodyNormalCharId, styles.bodyBoldCharId);
              firstRuns.forEach(r => firstPara.insertBefore(r, targetRun));
              firstPara.removeChild(targetRun);
              extraBlocks = parsed.blocks.slice(1);
            }

            extraBlocks.forEach(block => {
              if (block.type === 'table') {
                const tblNodes = createTableBlockNodes(xmlDoc, block, styles);
                tblNodes.forEach(n => secRoot.insertBefore(n, anchorNext));
              } else {
                const lineText = ' '.repeat(block.indent) + block.text;
                const runs = createRunNodes(xmlDoc, lineText, styles.bodyNormalCharId, styles.bodyBoldCharId);
                const newP = createHpEl(xmlDoc, 'p', {
                  id: 0, paraPrIDRef: styles.bodyParaId, styleIDRef: 0, pageBreak: 0, columnBreak: 0, merged: 0
                }, runs);
                secRoot.insertBefore(newP, anchorNext);
              }
            });
          }
        }

        // 3) {{ATTACHMENTS}} 치환 (본문 끝과 한 줄 여백 유지 보장)
        const attachTNode = Array.from(xmlDoc.getElementsByTagName('hp:t')).find(n => n.textContent.includes('{{ATTACHMENTS}}'));
        if (attachTNode) {
          const attachRun = attachTNode.parentNode;
          const attachPara = attachRun.parentNode;
          const secRoot = attachPara.parentNode;

          removeDirectLineSeg(attachPara);

          if (parsed.attachments.length === 0) {
            secRoot.removeChild(attachPara);
          } else {
            // attachPara 바로 앞에 빈 줄(여백 문단)이 있는지 확인하고 없으면 1줄 삽입
            const prevEl = attachPara.previousElementSibling;
            const hasEmptyLineBefore = prevEl && prevEl.nodeName === 'hp:p' && prevEl.textContent.trim() === '' && prevEl.getElementsByTagName('hp:tbl').length === 0;
            if (!hasEmptyLineBefore) {
              const spacerP = createHpEl(xmlDoc, 'p', {
                id: 0, paraPrIDRef: styles.bodyParaId, styleIDRef: 0, pageBreak: 0, columnBreak: 0, merged: 0
              }, [
                createHpEl(xmlDoc, 'run', { charPrIDRef: styles.bodyNormalCharId }, [createHpEl(xmlDoc, 't', {}, [''])])
              ]);
              secRoot.insertBefore(spacerP, attachPara);
            }

            attachPara.setAttribute('paraPrIDRef', styles.bodyParaId);
            attachRun.setAttribute('charPrIDRef', styles.bodyNormalCharId);
            attachTNode.textContent = '붙임  ' + parsed.attachments[0];
            const anchorNext = attachPara.nextSibling;

            parsed.attachments.slice(1).forEach(att => {
              const extraRun = createHpEl(xmlDoc, 'run', { charPrIDRef: styles.bodyNormalCharId }, [
                createHpEl(xmlDoc, 't', {}, ['      ' + att])
              ]);
              const extraP = createHpEl(xmlDoc, 'p', {
                id: 0, paraPrIDRef: styles.bodyParaId, styleIDRef: 0, pageBreak: 0, columnBreak: 0, merged: 0
              }, [extraRun]);
              secRoot.insertBefore(extraP, anchorNext);
            });
          }
        }

        // 4) 하단 결재란 표 자동 제거
        if (shouldRemoveBottom) {
          const allTables = Array.from(xmlDoc.getElementsByTagName('hp:tbl'));
          const bottomTbl = allTables.find(tbl => tbl.getAttribute('id') === '1349199001');
          if (bottomTbl && bottomTbl.parentNode) {
            bottomTbl.parentNode.removeChild(bottomTbl);
          }
        }

        let newXmlStr = serializer.serializeToString(xmlDoc);
        if (!newXmlStr.startsWith('<?xml')) {
          newXmlStr = '<?xml version="1.0" encoding="UTF-8" standalone="yes" ?>' + newXmlStr;
        }
        zip.file('Contents/section0.xml', newXmlStr);

        if (zip.file('mimetype')) {
          const mimeText = await zip.file('mimetype').async('string');
          zip.file('mimetype', mimeText, { compression: 'STORE' });
        }

        const outBlob = await zip.generateAsync({
          type: 'blob',
          mimeType: 'application/hwp+zip'
        });

        const today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
        const safeTitle = parsed.title.replace(/[\\/:*?"<>|]/g, '_').slice(0, 40);
        const downloadName = `${today}_${safeTitle}.hwpx`;

        const link = document.createElement('a');
        link.href = URL.createObjectURL(outBlob);
        link.download = downloadName;
        link.click();
        URL.revokeObjectURL(link.href);

      } catch (err) {
        alert('HWPX 생성 중 오류가 발생했습니다: ' + err.message);
        console.error(err);
      }
    }

    // 6. AI 프롬프트 복사 & 샘플 데이터 로드
    function copyAIPrompt() {
      const promptText = `방금 논의한 내용을 바탕으로 국립대학교 공문서 자동 변환기용 마크다운(.md) 초안을 작성해 줘. 반드시 아래 규칙을 지켜줘:
1. 최상단에 --- 로 감싼 YAML 헤더에 '제목'(줄바꿈 엔터 없이 한 줄로 작성)과 '붙임'(리스트 형태, 마지막 항목 끝에 '  끝.' 표기, 붙임이 없으면 '없음')만 작성할 것.
2. 본문은 '1. 관련'부터 시작하고 계층별 들여쓰기(1. /   가. /     1) /     -)를 정확히 맞출 것.
3. 강조할 핵심 문구나 금액은 **굵게**로 감쌀 것.
4. 표가 필요하면 표 바로 윗줄에 [단위: 건] 형태로 단위를 적고, 마크다운 표(| 항목 | 내용 |)로 작성할 것.`;

      navigator.clipboard.writeText(promptText).then(() => {
        alert('AI 공문 생성용 프롬프트가 클립보드에 복사되었습니다!\n채팅창에 붙여넣어 마크다운 초안을 받아보세요.');
      });
    }
